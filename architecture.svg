    <style>
      .band-title { font-size: 13px; font-weight: 700; fill: #607068; }
      .node-title { font-size: 14px; font-weight: 700; fill: #15231d; }
      .node-copy { font-size: 11.5px; fill: #53645c; }
      .edge { fill: none; stroke: #53645c; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #9a6c00; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrowExperiment); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#faf8f2"/>
  <text x="44" y="48" font-size="25" font-weight="800" fill="#075f46">FasterClas WhatsApp Bot</text>
  <text x="44" y="73" font-size="14" fill="#53645c">Legacy production architecture used for commercial validation - channel state in Node.js, generation in Python</text>

  <rect x="38" y="105" width="205" height="565" rx="8" fill="#f3efe4" stroke="#d8d1c1"/>
